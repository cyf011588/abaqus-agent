name: "悬臂梁端部简谐激励（B31 稳态动力扫频，共振峰对照一阶固有频率）"
build_script: "build_inp.py"
jobs_dir: "."

cli:
  mode: flags

params:
  L:
    type: float
    default: 200.0
    desc: "长度（x 向）"
  b:
    type: float
    default: 20.0
    desc: "几何参数 b"
  h:
    type: float
    default: 10.0
    desc: "截面高 / 板厚"
  nx:
    type: int
    default: 20
    desc: "x 向网格数"
  F:
    type: float
    default: 1.0
    desc: "集中力"
  E:
    type: float
    default: 210000.0
    desc: "弹性模量"
  nu:
    type: float
    default: 0.3
    desc: "泊松比"
  rho:
    type: float
    default: 7.9e-09
    desc: "密度"
  fmin:
    type: float
    default: 100.0
  fmax:
    type: float
    default: 400.0
  npoints:
    type: int
    default: 60
  job:
    type: str
    default: 'HARMONIC'
    desc: "作业名"
  out:
    type: str
    default: '.'

validators:
  - script: "../check_inp.py"
    key: structure
    desc: "inp 结构完整性（关键字 + 节点引用）"
    cli: "check_inp.py <inp>"

sop: |
  悬臂梁端部简谐激励（B31 稳态动力扫频，共振峰对照一阶固有频率）；参数含义见上面逐项 desc，未设 min/max 的表示不限制。
  生成后先 run_check(structure)，再用 3D 预览确认几何与边界位置。
