name: "细长杆轴向冲击（C3D8R 显式动力，一维应力波 σ=√(Eρ)·v 理论对照）"
build_script: "build_inp.py"
jobs_dir: "."

cli:
  mode: flags

params:
  L:
    type: float
    default: 500.0
    desc: "长度（x 向）"
  W:
    type: float
    default: 20.0
    desc: "宽度（y 向）"
  H:
    type: float
    default: 20.0
    desc: "高度（z 向）"
  nx:
    type: int
    default: 25
    desc: "x 向网格数"
  ny:
    type: int
    default: 2
    desc: "y 向网格数"
  nz:
    type: int
    default: 2
    desc: "z 向网格数"
  v:
    type: float
    default: 1000.0
    desc: "速度"
  E:
    type: float
    default: 210000.0
    desc: "弹性模量"
  nu:
    type: float
    default: 0.3
    desc: "泊松比"
  rho:
    type: float
    default: 7.9e-09
    desc: "密度"
  time:
    type: float
    default: 0.0002
  job:
    type: str
    default: 'DYNAMIC_EXPLICIT'
    desc: "作业名"
  out:
    type: str
    default: '.'

validators:
  - script: "../check_inp.py"
    key: structure
    desc: "inp 结构完整性（关键字 + 节点引用）"
    cli: "check_inp.py <inp>"

sop: |
  细长杆轴向冲击（C3D8R 显式动力，一维应力波 σ=√(Eρ)·v 理论对照）；参数含义见上面逐项 desc，未设 min/max 的表示不限制。
  生成后先 run_check(structure)，再用 3D 预览确认几何与边界位置。
