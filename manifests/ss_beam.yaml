name: "简支梁（B31 梁单元，两端简支+跨中载荷）"
build_script: "build_inp.py"
jobs_dir: "."

cli:
  mode: flags

params:
  L:
    type: float
    min: 1.0
    default: 1000.0
    desc: "梁跨"
  b:
    type: float
    min: 1.0
    default: 20.0
    desc: "矩形截面宽"
  h:
    type: float
    min: 1.0
    default: 40.0
    desc: "矩形截面高"
  E:
    type: float
    default: 210000.0
    desc: "弹性模量"
  nu:
    type: float
    default: 0.3
    desc: "泊松比"
  P:
    type: float
    default: 1000.0
    desc: "跨中集中力"
  nx:
    type: int
    min: 1
    default: 20
    desc: "长度方向网格数"
  job:
    type: str
    pattern: "^[A-Za-z0-9_.\\-]+$"
    desc: "作业名"

validators:
  - script: "../check_inp.py"
    key: structure
    desc: "inp 结构完整性（关键字 + 节点引用）"
    cli: "check_inp.py <inp>"

sop: |
  1. 简支梁：LEFT 铰支（1~3）、RIGHT 滚动（2~3）、跨中 MID -y 集中力；
  2. 改跨用 L，截面 b/h，网格 nx，载荷 P；
  3. 生成后 run_check(structure) 校验，3D 预览看梁线模型。
