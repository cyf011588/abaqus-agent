name: "受压柱线性屈曲（C3D8R + Buckle，欧拉临界载荷对照）"
build_script: "build_inp.py"
jobs_dir: "."

cli:
  mode: flags

params:
  L:
    type: float
    min: 1.0
    default: 1000.0
    desc: "柱长（长轴）"
  W:
    type: float
    min: 1.0
    default: 20.0
    desc: "截面宽"
  H:
    type: float
    min: 1.0
    default: 20.0
    desc: "截面高"
  E:
    type: float
    default: 210000.0
    desc: "弹性模量"
  nu:
    type: float
    default: 0.3
    desc: "泊松比"
  P:
    type: float
    default: 1.0
    desc: "参考轴向压力（屈曲因子基准）"
  nmodes:
    type: int
    min: 1
    default: 4
    desc: "屈曲模态阶数"
  nx:
    type: int
    min: 1
    default: 40
    desc: "长度方向网格数"
  ny:
    type: int
    min: 1
    default: 2
    desc: "截面宽网格数"
  nz:
    type: int
    min: 1
    default: 2
    desc: "截面高网格数"
  job:
    type: str
    pattern: "^[A-Za-z0-9_.\\-]+$"
    desc: "作业名"

validators:
  - script: "../check_inp.py"
    key: structure
    desc: "inp 结构完整性（关键字 + 节点引用）"
    cli: "check_inp.py <inp>"

sop: |
  1. 受压柱屈曲：FIXED 约束 1~3，TIP 轴向参考压力 -P，*Buckle 提取前 nmodes 阶；
  2. 改几何 L/W/H、参考载荷 P、网格 nx/ny/nz；
  3. 生成后 run_check(structure) 校验，3D 预览看柱体网格。
