name: "悬臂梁模态分析（C3D8R + Frequency，前 N 阶固有频率）"
build_script: "build_inp.py"
jobs_dir: "."

cli:
  mode: flags

params:
  L:
    type: float
    min: 1.0
    default: 100.0
    desc: "梁长"
  W:
    type: float
    min: 1.0
    default: 10.0
    desc: "梁宽"
  H:
    type: float
    min: 1.0
    default: 10.0
    desc: "梁高"
  E:
    type: float
    default: 210000.0
    desc: "弹性模量"
  nu:
    type: float
    default: 0.3
    desc: "泊松比"
  rho:
    type: float
    min: 1e-12
    default: 7.85e-09
    desc: "密度（t/mm³）"
  nmodes:
    type: int
    min: 1
    default: 6
    desc: "提取模态阶数"
  nx:
    type: int
    min: 1
    default: 20
    desc: "长度方向网格数"
  ny:
    type: int
    min: 1
    default: 2
    desc: "宽度方向网格数"
  nz:
    type: int
    min: 1
    default: 2
    desc: "高度方向网格数"
  job:
    type: str
    pattern: "^[A-Za-z0-9_.\\-]+$"
    desc: "作业名"

validators:
  - script: "../check_inp.py"
    key: structure
    desc: "inp 结构完整性（关键字 + 节点引用）"
    cli: "check_inp.py <inp>"

sop: |
  1. 悬臂梁模态：一端固定（FIXED 1~3），材料须含 *Density（rho），*Frequency 提取前 nmodes 阶；
  2. 改几何 L/W/H、密度 rho、阶数 nmodes、网格 nx/ny/nz；
  3. 生成后 run_check(structure) 校验，3D 预览看体网格。
