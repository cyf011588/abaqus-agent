# ============================================================
# 已接入的参数化建模技能（数据，不是代码）—— 公共部分，随仓库发布
# 每个技能：build_script 是生成器入口；validators 是自检/验收闸门。
# 只在本机有效的私有技能（真实项目、绝对路径）放 skills.local.yaml，
# 加载时覆盖/追加到这里，且不进 git（见 .gitignore 与 skills.local.example.yaml）。
# 新增技能：直接加一段，或在 Web 侧边栏「管理项目」里添加。
# 增删改技能不会动到 agent 代码，也不需要重启（下次 load_config 生效）。
# ============================================================

skills:
  cantilever:
    name: 悬臂梁（C3D8R 体单元，端部固定+自由端载荷）
    root: library/cantilever
    build_script: build_inp.py
    jobs_dir: .
    validators:
    - script: ../check_inp.py
      desc: inp 结构完整性（关键字+节点引用）
